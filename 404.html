<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#fff9ed">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Страница не найдена — HRNEIROWAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Forum&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/404.css">
</head>
<body>
  <main class="error-page" aria-labelledby="error-title">
    <h1 id="error-title" class="visually-hidden">Страница не найдена</h1>

    <div class="error-art">
      <img
        src="/assets/images/404/404-casper.jpg"
        alt="Каспер грустит рядом с надписью 404 — страница не найдена"
      >

      <nav class="error-art__hotspots" aria-label="Куда перейти">
        <a class="error-art__hotspot error-art__hotspot--home" href="/">
          <span class="visually-hidden">На главную</span>
        </a>
        <a class="error-art__hotspot error-art__hotspot--projects" href="/#portfolio">
          <span class="visually-hidden">Посмотреть проекты</span>
        </a>
      </nav>
    </div>

    <nav class="error-actions" aria-label="Куда перейти">
      <a class="error-action error-action--wine" href="/">На главную <span aria-hidden="true">→</span></a>
      <a class="error-action error-action--green" href="/#portfolio">Посмотреть проекты <span aria-hidden="true">→</span></a>
    </nav>
  </main>
</body>
</html>
